; PlatformIO Project Configuration
; Multi_04_I2C_RTOS_Gateway - STM32 Side
; RTOS: 2 FreeRTOS tasks (sensor read, I2C slave respond)
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = pre:extra_script_F103.py
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D STM32F1
    -D HSE_VALUE=8000000
    -I include
    -D configUSE_PREEMPTION=1
    -D configUSE_IDLE_HOOK=0
    -D configUSE_TICK_HOOK=0
    -D configCPU_CLOCK_HZ=72000000
    -D configTICK_RATE_HZ=1000
    -D configMAX_PRIORITIES=5
    -D configMINIMAL_STACK_SIZE=128
    -D configTOTAL_HEAP_SIZE=8192

[env:stm32f401cc]
platform = ststm32
board = genericSTM32F401CC
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F401xC
    -D HSE_VALUE=25000000
    -I include

[env:stm32f411ce]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -D HSE_VALUE=25000000
    -I include
