<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="270.20000000000005pt" width="164.93599999999998pt" viewBox="-60.86799999999999 -336.7 164.93599999999998 270.20000000000005"><text x="21.599999999999998" y="-336.59999999999997" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">P09: CRC-8 Checksum Error Detection</tspan></text><text x="21.599999999999998" y="-286.2" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">TX (Sender):</tspan></text><text x="21.599999999999998" y="-261.0" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  1. Payload data (NodeID, Temp, etc)</tspan></text><text x="21.599999999999998" y="-235.79999999999998" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  2. Calculate CRC-8 (poly=0x07)</tspan></text><text x="21.599999999999998" y="-210.6" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  3. Send: [Frame] + CRC + [ETX]</tspan></text><text x="21.599999999999998" y="-160.2" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">RX (Receiver):</tspan></text><text x="21.599999999999998" y="-135.0" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  1. Receive frame + CRC</tspan></text><text x="21.599999999999998" y="-109.79999999999998" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  2. Recalculate CRC-8 on payload</tspan></text><text x="21.599999999999998" y="-84.59999999999997" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  3. Compare: Match? Accept : Reject</tspan></text></svg>