[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

extra_scripts = pre:extra_script_F103.py

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -DFREERTOS
    -Iinclude

upload_protocol = stlink

