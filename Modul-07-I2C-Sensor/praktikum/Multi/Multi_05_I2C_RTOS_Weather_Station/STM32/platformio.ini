extra_scripts = extra_script_F4xx.py
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -D HSE_VALUE=25000000
    -I include
    -I /home/otomasi/.platformio/packages/framework-stm32cubef4/Middlewares/Third_Party/FreeRTOS/Source/include
    -I /home/otomasi/.platformio/packages/framework-stm32cubef4/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
