; ============================================================================
; STM32_13: I2C DMA Transfer - Fitur Khusus STM32
; ============================================================================
; STM32 memiliki hardware DMA untuk transfer I2C, sehingga CPU sepenuhnya
; bebas selama transfer data. ESP32 I2C TIDAK memiliki mode DMA.
; Target: AT24C32 EEPROM (0x50) untuk demonstrasi transfer data besar.
; ============================================================================

[env]
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DHAL_GPIO_MODULE_ENABLED
    -DHAL_TIM_MODULE_ENABLED
    -DHAL_I2C_MODULE_ENABLED
    -DHAL_DMA_MODULE_ENABLED

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8

[env:genericSTM32F401CC]
platform = ststm32
board = genericSTM32F401CC

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
