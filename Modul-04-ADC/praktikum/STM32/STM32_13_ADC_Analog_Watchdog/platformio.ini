; ============================================================================
; STM32_13: ADC Analog Watchdog - Fitur Hardware Khusus STM32
; ============================================================================
; Hardware Analog Watchdog memonitor nilai ADC secara hardware dan
; menghasilkan interrupt INSTAN ketika nilai keluar dari jendela threshold.
; ESP32 TIDAK memiliki fitur ini - harus menggunakan software polling.
; ============================================================================

[env]
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DHAL_ADC_MODULE_ENABLED
    -DHAL_UART_MODULE_ENABLED
    -DHAL_GPIO_MODULE_ENABLED
    -DHAL_TIM_MODULE_ENABLED

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8

[env:genericSTM32F401CC]
platform = ststm32
board = genericSTM32F401CC

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
