; Konfigurasi PlatformIO untuk STM32 FreeRTOS program
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -DFREERTOS
    -Iinclude
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/portable/GCC/ARM_CM3
upload_protocol = stlink

[env:stm32f401cc]
platform = ststm32
board = genericSTM32F401CC
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F401xC
    -DFREERTOS
    -Iinclude
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/portable/GCC/ARM_CM4F
upload_protocol = stlink

[env:stm32f411ce]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F411xE
    -DFREERTOS
    -Iinclude
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/portable/GCC/ARM_CM4F
