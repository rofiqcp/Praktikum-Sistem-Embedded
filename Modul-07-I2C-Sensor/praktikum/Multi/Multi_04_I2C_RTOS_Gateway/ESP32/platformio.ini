; PlatformIO Project Configuration
; Multi_04_I2C_RTOS_Gateway - ESP32 Side
; RTOS: 3 FreeRTOS tasks (sensor read, I2C slave response, logger)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

[env:lolin_s2]
platform = espressif32
board = lolin_s2_mini
framework = espidf
monitor_speed = 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
