; PlatformIO Project Configuration
; Multi_05_I2C_RTOS_Weather_Station - ESP32 Side
; RTOS: Multiple tasks untuk BME280+BH1750+DS3231+OLED
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

[env:lolin_s2]
platform = espressif32
board = lolin_s2_mini
framework = espidf
monitor_speed = 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
