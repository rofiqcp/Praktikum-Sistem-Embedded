; STM32Cube HAL
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D HSE_VALUE=8000000
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3

