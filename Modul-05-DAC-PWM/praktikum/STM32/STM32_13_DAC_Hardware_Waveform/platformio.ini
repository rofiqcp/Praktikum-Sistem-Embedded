; ============================================================================
; STM32_13: DAC Hardware Waveform Generator - Fitur Khusus STM32
; ============================================================================
; STM32 DAC dapat menghasilkan gelombang segitiga dan noise secara HARDWARE
; menggunakan DACEx. CPU usage = 0%! ESP32 harus menggunakan software + timer.
;
; CATATAN: STM32F103C8, F401CC, dan F411CE TIDAK memiliki peripheral DAC.
; Program ini menggunakan PWM (TIM3) sebagai fallback untuk board ini,
; sambil menyertakan kode DAC hardware yang siap untuk chip dengan DAC
; (misalnya STM32F405, F407, F446).
; ============================================================================

[env]
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DHAL_UART_MODULE_ENABLED
    -DHAL_GPIO_MODULE_ENABLED
    -DHAL_TIM_MODULE_ENABLED
    -DHAL_DMA_MODULE_ENABLED

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8

[env:genericSTM32F401CC]
platform = ststm32
board = genericSTM32F401CC

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
