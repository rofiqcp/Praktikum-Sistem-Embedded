<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="270.20000000000005pt" width="245.504pt" viewBox="-101.152 -336.7 245.504 270.20000000000005"><text x="21.599999999999998" y="-336.59999999999997" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">P08: Packet Framing STX/ETX + Byte Stuffing</tspan></text><text x="21.599999999999998" y="-286.2" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">Frame Format:</tspan></text><text x="21.599999999999998" y="-261.0" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  [STX:0x02] [NodeID] [Type] [Len] [Data] [CRC] [ETX:0x03]</tspan></text><text x="21.599999999999998" y="-210.6" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">Byte Stuffing Rule:</tspan></text><text x="21.599999999999998" y="-185.39999999999998" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">  If data contains STX/ETX/ESC:</tspan></text><text x="21.599999999999998" y="-160.2" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">    then Send ESC (0x1B) plus data byte</tspan></text><text x="21.599999999999998" y="-109.79999999999998" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">TX: Stuff data before send</tspan></text><text x="21.599999999999998" y="-84.59999999999997" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="21.599999999999998" dy="9">RX: De-stuff data after receive</tspan></text></svg>