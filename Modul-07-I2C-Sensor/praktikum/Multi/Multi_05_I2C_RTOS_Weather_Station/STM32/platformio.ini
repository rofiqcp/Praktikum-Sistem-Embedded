; PlatformIO Project Configuration
; Multi_05_I2C_RTOS_Weather_Station - STM32 Side
; RTOS: Multiple tasks untuk data processing
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = extra_script_F103.py
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D STM32F1
    -D HSE_VALUE=8000000
    -I include
    -I /home/otomasi/.platformio/packages/framework-stm32cubef1/Middlewares/Third_Party/FreeRTOS/Source/include
    -I /home/otomasi/.platformio/packages/framework-stm32cubef1/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM3

[env:stm32f401cc]
platform = ststm32
board = genericSTM32F401CC
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = extra_script_F4xx.py
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F401xC
    -D HSE_VALUE=25000000
    -I include
    -I /home/otomasi/.platformio/packages/framework-stm32cubef4/Middlewares/Third_Party/FreeRTOS/Source/include
    -I /home/otomasi/.platformio/packages/framework-stm32cubef4/Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard

[env:stm32f411ce]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
upload_protocol = stlink
